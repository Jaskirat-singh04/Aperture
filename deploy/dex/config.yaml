# Local OIDC identity provider for Aperture development. Not for production use.
#
# Seeded users use Dex's "groups" claim to carry both tenant and group
# membership, as plain strings with a prefix convention:
#   "tenant:<tenant_id>"  exactly one per user
#   "group:<group_name>"  zero or more per user, tenant-scoped by convention
#     (the Aperture auth layer combines tenant_id and group_name into the
#     OpenFGA group object id, for example "acme-finance")
#
# This avoids a custom Dex connector while still carrying the identity
# information Aperture needs to resolve OpenFGA relationship tuples.

issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  grantTypes:
    - "authorization_code"
    - "refresh_token"
    - "password"
  passwordConnector: local

staticClients:
  - id: aperture-api
    secret: aperture-local-dev-secret
    name: "Aperture API"
    redirectURIs:
      - "http://localhost:8000/callback"

# Dex needs at least one connector configured even when only the local
# password database is used for logins.
connectors:
  - type: mockCallback
    id: mock
    name: Example

# A static list of passwords, used instead of an external identity backend.
# All three demo users share the password "password", this is the
# well-known bcrypt hash for that string from Dex's own example config,
# fine for a local-only development identity provider.
enablePasswordDB: true
staticPasswords:
  - email: "alice@acme.test"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "alice"
    userID: "11111111-1111-1111-1111-111111111111"
    groups:
      - "tenant:acme"
      - "group:finance"
  - email: "bob@acme.test"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "bob"
    userID: "22222222-2222-2222-2222-222222222222"
    groups:
      - "tenant:acme"
      - "group:engineering"
  - email: "carol@globex.test"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "carol"
    userID: "33333333-3333-3333-3333-333333333333"
    groups:
      - "tenant:globex"
      - "group:finance"

signer:
  type: local
  config:
    algorithm: "RS256"
